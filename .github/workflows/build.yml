name: Build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ['20.19', '24']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Start the server
        run: |
          export DATA_DIR="$RUNNER_TEMP/data" UPLOAD_DIR="$RUNNER_TEMP/uploads" PORT=3001
          node server/index.js &
          for i in $(seq 1 20); do
            curl -fs http://localhost:3001/api/site > /dev/null && exit 0
            sleep 1
          done
          echo "The server did not start."
          exit 1
